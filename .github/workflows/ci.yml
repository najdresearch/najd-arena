name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - name: Reject committed secrets and oversized files
        run: |
          ! git grep -En 'sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          test -z "$(find . -type f -not -path './.git/*' -not -path './.venv/*' -size +10M -print -quit)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose build
      - run: docker compose run --rm arena dataset validate examples/acceptance

