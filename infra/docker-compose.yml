name: najd-arena
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: arena, POSTGRES_PASSWORD: arena, POSTGRES_DB: arena}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U arena], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 20}
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: arena, MINIO_ROOT_PASSWORD: arena-local-development}
    volumes: [minio-data:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: [/bin/sh, -c]
    command: ["until mc alias set local http://minio:9000 arena arena-local-development; do sleep 1; done; mc mb --ignore-existing local/arena-results"]
  migrate:
    build: {context: .., dockerfile: infra/Dockerfile.web, target: build}
    command: [pnpm, --dir, web, db:migrate]
    environment: {DATABASE_URL: postgres://arena:arena@postgres:5432/arena}
    depends_on: {postgres: {condition: service_healthy}}
  web:
    build: {context: .., dockerfile: infra/Dockerfile.web}
    env_file: [{path: ../.env, required: false}]
    environment: {DATABASE_URL: postgres://arena:arena@postgres:5432/arena, REDIS_URL: redis://redis:6379/0}
    ports: ["3000:3000"]
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
  worker-orchestration: &worker
    build: {context: .., dockerfile: infra/Dockerfile.worker}
    env_file: [{path: ../.env, required: false}]
    environment: &worker-env
      DATABASE_URL: postgres://arena:arena@postgres:5432/arena
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: arena
      S3_SECRET_ACCESS_KEY: arena-local-development
      S3_BUCKET: arena-results
      ARENA_WORKER_ROLE: orchestration
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}, minio-init: {condition: service_completed_successfully}}
  worker-inference:
    <<: *worker
    environment: {<<: *worker-env, ARENA_WORKER_ROLE: inference}
    deploy: {replicas: 2}
  worker-grading:
    <<: *worker
    environment: {<<: *worker-env, ARENA_WORKER_ROLE: grading}
    deploy: {replicas: 2}
volumes: {postgres-data: {}, redis-data: {}, minio-data: {}}
