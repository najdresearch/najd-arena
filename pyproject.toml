[project]
name = "najd-arena"
version = "0.1.0"
description = "Reproducible, evidence-first evaluation for models and agents"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "jsonschema>=4.25,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.13,<1"]
publish = ["huggingface-hub>=1.1,<2"]

[project.scripts]
najd-arena = "najd_arena.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/najd_arena"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "najd_arena/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
