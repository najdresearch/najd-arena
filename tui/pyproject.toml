[project]
name = "najd-arena"
version = "1.0.0"
description = "Arabic-first model evaluation TUI and worker runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "cryptography>=44,<46",
  "huggingface-hub>=0.30,<2",
  "jsonschema>=4.23,<5",
  "litellm>=1.70,<2",
  "najd-benchmark",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
  "textual>=2.1,<3",
]

[project.optional-dependencies]
worker = ["boto3>=1.38,<2", "psycopg[binary]>=3.2,<4", "redis>=6,<7"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[project.scripts]
najd-arena = "najd_arena.cli:main"
najd-arena-worker = "najd_arena.worker:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/najd_arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.sources]
najd-benchmark = { git = "https://github.com/najdresearch/benchmark.git", rev = "e7d44cc4d17de5b6159fbdf9c9a895485097a251" }
